name: CI

on:
  push:
    branches:
      - 'main'
      - '5.x'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testsuite:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.3'
            dependencies: highest
          - php-version: '8.4'
            dependencies: highest
          - php-version: '8.5'
            dependencies: highest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, intl, mongodb, sqlite
        coverage: pcov
        ini-values: apc.enable_cli = 1, zend.assertions = 1, pcov.directory = src

    - name: Cache composer dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache
        key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}

    - name: composer install
      run: |
        if [[ "${{ matrix.dependencies }}" == 'lowest' ]]; then
          composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress
        else
          composer install --prefer-dist --no-progress
        fi

    - name: Wait for MongoDB to be ready
      run: |
        for i in {1..30}; do
          if nc -z localhost 27017; then
            echo "MongoDB is ready"
            exit 0
          fi
          echo "Waiting for MongoDB... (attempt $i/30)"
          sleep 2
        done
        echo "MongoDB did not become ready in time"
        exit 1

    - name: Run PHPUnit
      run: vendor/bin/phpunit --configuration=phpunit.xml.dist
      env:
        TEST_MONGO_HOST: localhost

  cs-stan:
    name: Coding Standard & Static Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, intl, mongodb, sqlite
        coverage: none

    - name: Cache composer dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache
        key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}

    - name: composer install
      run: composer install --prefer-dist --no-progress

    - name: Run PHP CodeSniffer
      run: composer cs-check

    - name: Run PHP CodeSniffer
      run: composer rector-check

    - name: Run phpstan
      run: composer stan
      env:
        TEST_MONGO_HOST: localhost

    - name: Run phpstan
      run: composer structarmed
